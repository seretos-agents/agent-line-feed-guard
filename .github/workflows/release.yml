name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. Pre-flight (.github/scripts/release-preflight.sh) validates the
#      version, resolves the previous release tag, and fails before any
#      side effect if <TAG> or src/<TAG> already exists, or if the
#      previous release's src/<PREV_TAG> marker is missing (see AGENTS.md
#      for the one-time bootstrap procedure).
#   3. Workflow stamps the version into both plugin manifests (in CI only),
#      pushes src/<TAG> at main's tip (an ordinary, non-orphan marker commit
#      used only so release notes can be generated from main's real
#      history), then pushes an orphan release branch with install-ready
#      files, creates the agent-line-feed-guard--v{version} tag on that
#      orphan commit, and publishes a GitHub Release with notes generated
#      from main's history and the zip attached.
#   4. The workflow then reads the changelog back from the published
#      release and notifies agent-marketplace directly via
#      MARKETPLACE_DISPATCH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Replaces both the old inline "Validate version is semver" step (loose
      # regex) and "Fail if tag already exists" step (prefix-matching plural
      # `refs` endpoint). The strict semver grammar and the previous-tag
      # resolution now live only in prev-release-tag.sh, which this delegates
      # to; existence checks use the exact-match singular `ref` endpoint.
      - name: Pre-flight
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          git tag -l | bash .github/scripts/release-preflight.sh \
            "${{ github.repository }}" "$PLUGIN_NAME" "${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Run hook tests
        shell: bash
        run: node scripts/line-feed-guard-hook.test.mjs

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-line-feed-guard"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/hooks" "$STAGE/scripts"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a hooks/. "$STAGE/hooks/"
          cp -a scripts/. "$STAGE/scripts/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch payload's
          # icon URL (raw.githubusercontent.com/${repo}/${TAG}/assets/icon.png)
          # resolves.
          if [ -d assets ]; then cp -a assets "$STAGE/"; fi
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          if [ -f description.md ]; then cp -a description.md "$STAGE/"; fi
          # skills/ carries the preventive rule and the on-demand scan skill.
          if [ -d skills ]; then cp -a skills "$STAGE/"; fi

          # The whole point of this plugin is that CRLF in these files makes them
          # invisible. Refuse to ship an install tree that contains any.
          if grep -rlIU $'\r' "$STAGE" ; then
            echo "::error::staged install tree contains CR bytes"
            exit 1
          fi

          mkdir -p dist
          ZIPNAME="agent-line-feed-guard-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      # Pushed unconditionally, with no "skip if exists" guard -- pre-flight
      # already proved src/<TAG> is absent. This is an ordinary commit at
      # main's tip (captured by pre-flight before any step could move HEAD),
      # never a historical commit, so GITHUB_TOKEN's contents:write is
      # sufficient (see the plan's token/permission table). It is the only
      # thing that gives `releases/generate-notes` two endpoints sharing
      # main's real history -- the orphan release commit has no merge-base
      # with anything.
      - name: Push source marker (src/<TAG>)
        shell: bash
        run: |
          TAG="${{ steps.preflight.outputs.tag }}"
          MAIN_SHA="${{ steps.preflight.outputs.main_sha }}"
          git tag "src/${TAG}" "$MAIN_SHA"
          git push origin "refs/tags/src/${TAG}"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # The scripts dir is copied out of the worktree before the orphan
          # checkout + `git clean -fdx` below wipe it -- the dispatch step
          # still needs marketplace-payload.sh afterwards.
          cp -a .github/scripts "$RUNNER_TEMP/release-scripts"

          # Stash the staging tree AND the release zip outside the worktree,
          # since "git checkout --orphan" + clean will wipe dist/ before we
          # attach the zip to the GitHub Release.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          # Verify the hook payload actually landed in the orphan commit — a
          # release without these files installs as a silently inert plugin.
          for f in hooks/hooks.json scripts/line-feed-guard-hook.mjs; do
            if ! git cat-file -e "HEAD:${f}" 2>/dev/null; then
              echo "::error::required artifact missing from orphan release commit: ${f}"
              exit 1
            fi
          done
          echo "Verified: hook payload is present in the release commit."

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes and create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.preflight.outputs.tag }}"
          PREV_TAG="${{ steps.preflight.outputs.prev_tag }}"
          MAIN_SHA="${{ steps.preflight.outputs.main_sha }}"

          # --generate-notes / --notes-start-tag walk history from the tag
          # being created -- here an orphan commit with no merge-base to
          # anything -- and publish an empty body (the bug this package
          # fixes). Ask the API directly to walk main's real history between
          # the two src/<tag> markers instead, which do share history, and
          # attach the result to the orphan release with --notes-file.
          ARGS=(-f tag_name="src/${TAG}" -f target_commitish="$MAIN_SHA")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=(-f previous_tag_name="src/${PREV_TAG}")
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${ARGS[@]}" --jq .body > notes.md

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file notes.md \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          VERSION:  ${{ inputs.version }}
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          TAG="${{ steps.preflight.outputs.tag }}"

          # `gh release view --json body --jq .body` prints the published
          # body via command substitution, which unconditionally strips ALL
          # trailing newlines -- the `&& printf x` sentinel lets us tell that
          # apart from "the body genuinely had no trailing newline", so we
          # can strip back off exactly the one newline the published body is
          # expected to end with, no more.
          RAW="$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body && printf x)"
          RAW="${RAW%x}"
          CHANGELOG="${RAW%$'\n'}"

          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="${{ github.repository }}" VERSION="$VERSION" CHANGELOG="$CHANGELOG" \
            bash "$RUNNER_TEMP/release-scripts/marketplace-payload.sh")

          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload, two
          # independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d "$PAYLOAD"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d "$PAYLOAD"
